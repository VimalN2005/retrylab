[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retrylab"
version = "0.1.0-alpha.1"
description = "Deterministic third-party API failure simulation & reliability testing engine for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "api-testing",
    "chaos-engineering",
    "reliability",
    "httpx",
    "fault-injection",
    "resilience",
    "testing",
    "mocking"
]
authors = [
    { name = "Vimal N", email = "vimaln2005@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.25.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/VimalN2005/retrylab"
Repository = "https://github.com/VimalN2005/retrylab"
Issues = "https://github.com/VimalN2005/retrylab/issues"

[project.scripts]
retrylab = "retrylab.cli.main:app"

[project.entry-points.pytest11]
retrylab = "retrylab.pytest_plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["retrylab*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers -p no:rerunfailures"
testpaths = ["tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]
